# Node.js

# Build a general Node.js project with npm.
# Add steps that analyze code, save build artifacts, deploy, and more:
# https://docs.microsoft.com/azure/devops/pipelines/languages/javascript

trigger:
  - master
  - develop
  - feature/*
  - release/*
  - greenkeeper/*

pool:
  vmImage: 'ubuntu-latest'

steps:
  - task: NodeTool@0
    inputs:
      versionSpec: '20.x'
    displayName: 'Install Node.js'
  - script: yarn install
    displayName: 'Yarn install'

  - script: yarn build
    displayName: 'Build'

  - script: yarn lint
    displayName: 'Yarn Lint'

  - script: yarn test
    displayName: 'Unit tests'

  - script: yarn playwright install --with-deps
    displayName: Install Playwright browsers

  - script: yarn test:e2e:install
    displayName: 'E2E installer tests'

  - script: yarn test:e2e
    displayName: 'E2E app tests'

  - task: PublishTestResults@2
    displayName: Publish test results
    condition: always()
    inputs:
      testRunner: JUnit
      testResultsFiles: '$(System.DefaultWorkingDirectory)/frontend/testresults/output.xml'
