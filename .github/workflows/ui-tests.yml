name: UI tests for StackCraft
on: [push]
jobs:
  build:
    name: Build and run UI tests
    timeout-minutes: 15
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x]

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: stackcraft
          POSTGRES_PASSWORD: stackcraft
          POSTGRES_DB: stackcraft
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://stackcraft:stackcraft@localhost:5433/stackcraft

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies
        run: yarn install
      - name: Build app
        run: yarn build
      - name: Install Playwright browsers
        run: yarn playwright install --with-deps

      - name: Run installer tests
        run: yarn test:e2e:install
      - name: Run app tests
        run: yarn test:e2e --workers 1
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          path: e2e
          name: ScreenShots
